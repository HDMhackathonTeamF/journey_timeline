services:
  db:
    image: postgres:17-alpine
    restart: always
    shm_size: 128mb
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    
  adminer:
    image: adminer
    restart: always
    ports:
      - 127.0.0.1:3200:8080
